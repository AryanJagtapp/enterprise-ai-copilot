name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check app tests

      - name: Unit + integration tests
        # GEMINI_API_KEY is sourced from a GitHub Actions repository secret
        # (Settings -> Secrets and variables -> Actions -> GEMINI_API_KEY),
        # never committed to the repo. If the secret is unset (e.g. on a
        # fork's PR, where secrets are withheld by GitHub), the `||` fallback
        # below supplies a placeholder string that the app's own
        # gemini_client.py recognizes as "not a real key" and deliberately
        # routes to the extractive-fallback code path — so CI still exercises
        # the fallback path honestly rather than silently skipping tests.
        env:
          DATABASE_URL: "sqlite:///:memory:"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci-placeholder-key' }}
        run: pytest -v --cov=app --cov-report=term-missing

      - name: Security checks (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true  # advisory for Phase 1; hard-fail once dependencies stabilize

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build

  docker-build:
    needs: [backend]
    runs-on: ubuntu-latest
    if: false  # Dockerfile is written but this sandbox has no Docker daemon to verify it builds — flip on once Satish confirms a local `docker build` succeeds
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t enterprise-ai-copilot-backend ./backend

  deploy-staging:
    # T43 requires the pipeline to read lint -> test -> build -> deploy to
    # staging, in that order and gated on the earlier stages actually
    # passing — not a deploy that fires independently of CI on every push.
    # Render is the staging host (see docs/T44_Runbook.md); this job never
    # talks to Render's API directly, it just POSTs to a per-service Deploy
    # Hook URL, which is the simplest mechanism Render offers for exactly
    # this "let CI decide when to deploy" use case.
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render staging deploy
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set yet — staging isn't configured, skipping deploy without failing the pipeline."
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deploy hook triggered — check the Render dashboard for build/deploy progress."
