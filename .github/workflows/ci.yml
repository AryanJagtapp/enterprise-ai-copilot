name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check app tests

      - name: Unit + integration tests
        # GEMINI_API_KEY is sourced from a GitHub Actions repository secret
        # (Settings -> Secrets and variables -> Actions -> GEMINI_API_KEY),
        # never committed to the repo. If the secret is unset (e.g. on a
        # fork's PR, where secrets are withheld by GitHub), the `||` fallback
        # below supplies a placeholder string that the app's own
        # gemini_client.py recognizes as "not a real key" and deliberately
        # routes to the extractive-fallback code path — so CI still exercises
        # the fallback path honestly rather than silently skipping tests.
        env:
          DATABASE_URL: "sqlite:///:memory:"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci-placeholder-key' }}
        run: pytest -v --cov=app --cov-report=term-missing

      - name: Security checks (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true  # advisory for Phase 1; hard-fail once dependencies stabilize

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build

  docker-build:
    needs: [backend]
    runs-on: ubuntu-latest
    if: false  # Dockerfile is written but this sandbox has no Docker daemon to verify it builds — flip on once Satish confirms a local `docker build` succeeds
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t enterprise-ai-copilot-backend ./backend
